<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Project Approval Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: form rail on the left, a live A4 sheet on the right; stacks on phones. */
:root{
  --bg:#eef0f3; --panel:#ffffff; --fg:#16181c; --muted:#5d6370; --line:#d6dae1;
  --accent:#1d1f24; --accent-fg:#f2f3f5; --field:#f7f8fa; --ok:#1f7a4d; --warn:#a15c00;
  --ui:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* paper is a fixed physical look in both themes */
  --ink:#141518; --ink-soft:#4a4f58; --paper:#ffffff; --band:#0b0b0c; --silver:#c9ccd2; --rule:#d9dce1;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1012; --panel:#17191c; --fg:#e8eaee; --muted:#9aa0ab; --line:#2a2d33;
  --accent:#d4d7dd; --accent-fg:#111214; --field:#1e2125; --ok:#5cc28f; --warn:#f0a94b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1012; --panel:#17191c; --fg:#e8eaee; --muted:#9aa0ab; --line:#2a2d33;
  --accent:#d4d7dd; --accent-fg:#111214; --field:#1e2125; --ok:#5cc28f; --warn:#f0a94b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.app{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

header.top{max-width:1360px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header.top h1{font-size:18px;font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
header.top p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}

.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 18px 18px;min-width:0}
details{border-bottom:1px solid var(--line);padding:12px 0}
details:last-of-type{border-bottom:0}
summary{cursor:pointer;font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font-size:15px;line-height:1}
details[open] summary::after{content:"–"}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input,textarea,select{font:inherit;font-size:13.5px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.45}
.hint{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.words{font-size:11.5px;color:var(--muted);font-style:italic}

.stage{position:sticky;top:16px;min-width:0}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.fit{font-weight:600}
.fit.ok{color:var(--ok)} .fit.warn{color:var(--warn)}
.sheetwrap{width:100%;position:relative;overflow:hidden;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.14)}
.sheetwrap .page{transform-origin:top left;position:absolute;top:0;left:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;max-width:calc(100% - 32px)}

/* ---------- The letter (A4 @ 96dpi = 794 x 1123) ---------- */
.page{position:relative;width:794px;height:1123px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;font-family:var(--serif);overflow:hidden}
.wm{position:absolute;left:0;right:0;top:300px;text-align:center;opacity:.06;pointer-events:none;z-index:0}
.wm img{width:380px;height:auto;display:block;margin:0 auto}
.wm div{margin-top:22px;font-family:var(--ui);font-weight:600;font-size:30px;letter-spacing:.14em;line-height:1.25;color:#141518}
.lh,.lt-body,.lf{position:relative;z-index:1}
.lh{background:transparent;color:var(--ink);padding:30px 0 18px;margin:0 56px;border-bottom:1px solid #141518;position:relative}
.lh-in{display:flex;align-items:center;gap:22px;position:relative}
.lh img{width:78px;height:auto;display:block}
.lh-name{font-family:var(--ui);font-weight:600;font-size:21px;letter-spacing:.14em;line-height:1.2;color:#141518}
.lh-rule{width:150px;height:1px;background:#6d7178;margin:9px 0 7px}
.lh-cin{font-family:var(--ui);font-weight:500;font-size:10.5px;letter-spacing:.12em;color:#3a3e45}
.lh-side{margin-left:auto;text-align:right;font-family:var(--ui);font-size:9.5px;line-height:1.7;color:#4a4f58;letter-spacing:.02em}

.lt-body{flex:1;padding:30px 56px 16px;font-size:var(--fs,13px);line-height:1.52;overflow:hidden;display:flex;flex-direction:column;gap:.85em}
.meta{display:flex;justify-content:space-between;font-family:var(--ui);font-size:.82em;letter-spacing:.04em;color:var(--ink-soft)}
.meta b{color:var(--ink);font-weight:600}
.doc-tag{font-family:var(--ui);font-size:.74em;letter-spacing:.24em;font-weight:600;text-transform:uppercase;color:var(--ink);text-align:center;padding:.35em 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.to{line-height:1.45}
.to .lbl{font-family:var(--ui);font-size:.78em;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:.15em}
.subj{font-weight:600}
.subj span{font-family:var(--ui);font-size:.8em;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-right:.4em}
.lt-body p{margin:0}
table.det{width:100%;border-collapse:collapse;font-size:.95em}
table.det th{width:32%;text-align:left;font-family:var(--ui);font-weight:600;font-size:.8em;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);vertical-align:top;padding:.45em .8em .45em 0;border-bottom:1px solid var(--rule)}
table.det td{padding:.42em 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.det td .w{display:block;font-style:italic;font-size:.88em;color:var(--ink-soft)}
.sec-h{font-family:var(--ui);font-weight:600;font-size:.78em;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.3em}
ol.lst,ul.lst{margin:0;padding-left:1.35em}
ol.lst li,ul.lst li{margin:.12em 0}
.sign{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-top:.4em}
.sign .for{font-weight:600}
.accept{font-size:.85em;color:var(--ink-soft);text-align:right;line-height:1.5}
.accept .ln{display:inline-block;width:180px;border-bottom:1px solid var(--ink-soft);margin-top:30px}

.lf{background:transparent;color:#4a4f58;border-top:1px solid #141518;margin:0 56px;padding-left:0!important;padding-right:0!important;font-family:var(--ui);font-size:9.3px;letter-spacing:.03em;padding:11px 44px;display:flex;justify-content:space-between;gap:16px;line-height:1.55}
.lf b{color:#141518;font-weight:600}
.lf .r{text-align:right}

#capture{position:fixed;left:-20000px;top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Project Approval Letters</h1>
    <p>Mycelium Dynamics Private Limited · fill the form, check the sheet, download the PDF.</p>
  </div>
  <div class="actions">
    <button id="btnNew" type="button">New letter</button>
    <button id="btnCopy" type="button">Copy email text</button>
    <button id="btnPdf" class="primary" type="button">Download PDF</button>
  </div>
</header>

<div class="app">
  <form class="form" id="f" autocomplete="off">
    <details open>
      <summary>Letter</summary>
      <div class="grid">
        <label>Reference no.<input id="ref" name="ref"></label>
        <label>Letter date<input id="date" name="date" type="date"></label>
      </div>
    </details>

    <details open>
      <summary>Client</summary>
      <div class="grid">
        <label>Contact person<input id="contact" name="contact"></label>
        <label>Designation<input id="contactDesig" name="contactDesig"></label>
        <label class="full">Client company<input id="client" name="client"></label>
        <label class="full">Address<textarea id="clientAddr" name="clientAddr" rows="2"></textarea></label>
        <label class="full">Mobile number<input id="clientMobile" name="clientMobile" type="tel" inputmode="tel" autocomplete="tel"></label>
      </div>
    </details>

    <details open>
      <summary>Project</summary>
      <div class="grid">
        <label class="full">Project title<input id="project" name="project"></label>
        <label>Project ID<input id="projectId" name="projectId"></label>
        <label>Proposal reference / date<input id="proposalRef" name="proposalRef"></label>
        <label class="full">Scope of work<textarea id="scope" name="scope" rows="3"></textarea></label>
        <label>Approved value (₹)<input id="amount" name="amount" inputmode="decimal"></label>
        <label>Tax note<input id="tax" name="tax"></label>
        <p class="words full" id="amountWords"></p>
        <label class="full">Payment terms<input id="payment" name="payment"></label>
        <label>Start date<input id="start" name="start" type="date"></label>
        <label>Target completion<input id="end" name="end" type="date"></label>
        <label class="full">Deliverables <span class="hint">One per line</span><textarea id="deliverables" name="deliverables" rows="4"></textarea></label>
      </div>
    </details>

    <details>
      <summary>Wording &amp; terms</summary>
      <div class="grid">
        <label class="full">Opening paragraph<textarea id="opening" name="opening" rows="4"></textarea>
          <span class="hint">{client}, {project}, {proposal} are filled in automatically.</span></label>
        <label class="full">Terms &amp; conditions <span class="hint">One per line</span><textarea id="terms" name="terms" rows="5"></textarea></label>
        <label class="full">Closing paragraph<textarea id="closing" name="closing" rows="3"></textarea></label>
        <label class="full"><span><input type="checkbox" id="showAccept" name="showAccept" style="width:auto;margin-right:6px">Add client acceptance signature line</span></label>
      </div>
    </details>

  </form>

  <section class="stage" aria-label="Letter preview">
    <div class="stagebar"><span>A4 preview · updates as you type</span><span class="fit ok" id="fitMsg">Fits on one page</span></div>
    <div class="sheetwrap" id="wrap"><div class="page" id="page"></div></div>
  </section>
</div>
<div id="capture" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>

function words(v){
  const n=Number(String(v).replace(/[^0-9.]/g,""));if(!v||isNaN(n)||n<=0)return"";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three=x=>(x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");
  function conv(x){if(x===0)return"Zero";let out=[];
    const cr=Math.floor(x/1e7);x%=1e7;const l=Math.floor(x/1e5);x%=1e5;const t=Math.floor(x/1e3);x%=1e3;
    if(cr)out.push((cr>=100?conv(cr):two(cr))+" Crore");if(l)out.push(two(l)+" Lakh");if(t)out.push(two(t)+" Thousand");if(x)out.push(three(x));return out.join(" ")}
  const r=Math.floor(n),p=Math.round((n-r)*100);
  return"Rupees "+conv(r)+(p?" and "+two(p)+" Paise":"")+" Only";
}

  const row=(k,v)=>{if(v)rows.push(`<tr><th>${k}</th><td>${v}</td></tr>`)};
  row("Project Title",esc(s.project));row("Project ID",esc(s.projectId));row("Scope of Work",nl(s.scope));
  if(s.amount)row("Approved Value",`${esc(inr(s.amount))}${s.tax?` <span style="color:var(--ink-soft)">(${esc(s.tax)})</span>`:""}<span class="w">${esc(words(s.amount))}</span>`);
  row("Payment Terms",esc(s.payment));row("Commencement",esc(fmtDate(s.start)));
  if(s.end)row("Target Completion",esc(fmtDate(s.end))+(months(s.start,s.end)?` <span style="color:var(--ink-soft)">(${months(s.start,s.end)})</span>`:""));
  const del=lines(s.deliverables),terms=lines(s.terms);
  return `
  <div class="wm"><img src="${LOGO}" alt=""><div>MYCELIUM DYNAMICS<br>PRIVATE LIMITED</div></div>
  <div class="lh"><div class="lh-in">
    <img src="${LOGO_GOLD}" alt="">
    <div><div class="lh-name">MYCELIUM DYNAMICS<br>PRIVATE LIMITED</div><div class="lh-rule"></div><div class="lh-cin">CIN: ${CO.cin}</div></div>
    <div class="lh-side">${CO.email}<br>${CO.mobile}<br>New Delhi, India</div>
  </div></div>
  <div class="lt-body">
    <div class="meta"><span>Ref: <b>${esc(s.ref)}</b></span><span>Date: <b>${esc(fmtDate(s.date))}</b></span></div>
    <div class="doc-tag">Project Approval Letter</div>
    <div class="to"><div class="lbl">To</div>
      ${s.contact?`<div><b>${esc(s.contact)}</b>${s.contactDesig?", "+esc(s.contactDesig):""}</div>`:""}
      ${s.client?`<div>${esc(s.client)}</div>`:""}
      ${s.clientAddr?`<div>${nl(s.clientAddr)}</div>`:""}
      ${s.clientMobile?`<div style="color:var(--ink-soft)">Mobile: ${esc(s.clientMobile)}</div>`:""}
    </div>
    <div class="subj"><span>Subject:</span>Approval of Project – ${esc(s.project||"")}</div>
    <p>Dear ${esc(s.contact||"Sir/Madam")},</p>
    <p>${nl(tok(s.opening))}</p>
    ${rows.length?`<table class="det">${rows.join("")}</table>`:""}
    ${del.length?`<div><div class="sec-h">Deliverables</div><ul class="lst">${del.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    ${terms.length?`<div><div class="sec-h">Terms &amp; Conditions</div><ol class="lst">${terms.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}
    ${s.closing?`<p>${nl(tok(s.closing))}</p>`:""}
    <div class="sign">
      <div>
        <div>${s.contact?"Yours sincerely,":"Yours faithfully,"}</div>
        <div class="for">For ${CO.name}</div>
      </div>
      ${s.showAccept?`<div class="accept">Accepted on behalf of ${esc(s.client||"the client")}<br><span class="ln"></span><br>Signature, name &amp; date</div>`:""}
    </div>
  </div>
  <div class="lf">
    <div><b>Regd. Office:</b> ${CO.addr1}<br>${CO.addr2}</div>
    <div class="r">Email: ${CO.email} &nbsp;|&nbsp; Mobile: ${CO.mobile}<br>CIN: ${CO.cin}</div>
  </div>`;
}

// shrink body text until the letter fits on one A4 page
function fitPage(page){
  const body=page.querySelector(".lt-body");let fs=13;
  body.style.setProperty("--fs",fs+"px");
  while(body.scrollHeight>body.clientHeight+1&&fs>10){fs-=.25;body.style.setProperty("--fs",fs+"px")}
  return {fs,over:body.scrollHeight>body.clientHeight+1};
}
function render(){
  const page=$("page");page.innerHTML=letterHTML();
  const r=fitPage(page);
  const m=$("fitMsg");
  if(r.over){m.textContent="Too long for one page. Shorten the scope, deliverables or terms.";m.className="fit warn"}
  else if(r.fs<13){m.textContent="Fits on one page (text slightly reduced)";m.className="fit ok"}
  else{m.textContent="Fits on one page";m.className="fit ok"}
  $("amountWords").textContent=words(state.amount);
  scale();
}
function scale(){const w=$("wrap").clientWidth,k=w/794;$("page").style.transform=`scale(${k})`;$("wrap").style.height=1123*k+"px"}

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}

$("f").addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="showAccept")state.showAccept=t.checked;else if(F.includes(t.id))state[t.id]=t.value;
  save();render();
});
$("f").addEventListener("submit",e=>e.preventDefault());

$("btnNew").addEventListener("click",()=>{
  counter+=1;
  state={...state,ref:refFor(counter),date:today(),contact:"",contactDesig:"",client:"",clientAddr:"",clientMobile:"",
    project:"",projectId:"",proposalRef:"",scope:"",amount:"",payment:"",start:"",end:"",deliverables:""};
  save();fill();render();toast("Started "+state.ref+". Terms and wording were kept.");
  $("contact").focus();
});

function fileName(){const c=(state.client||"Client").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");return `Project_Approval_${c}_${(state.ref||"").replace(/[^A-Za-z0-9-]+/g,"-")}.pdf`}

$("btnPdf").addEventListener("click",async()=>{
  const btn=$("btnPdf");btn.disabled=true;btn.textContent="Preparing…";
  try{
    if(!window.html2canvas||!window.jspdf)throw{message:"The PDF library did not load. Check your connection and reload the page."};
    await document.fonts.ready;
    const host=$("capture");host.innerHTML="";
    const p=document.createElement("div");p.className="page";p.innerHTML=letterHTML();host.appendChild(p);fitPage(p);
    await Promise.all([...p.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const canvas=await html2canvas(p,{scale:2.5,backgroundColor:"#ffffff",useCORS:true,logging:false,width:794,height:1123});
    host.innerHTML="";
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    pdf.setProperties({title:`Project Approval – ${state.project||""}`,author:CO.name,subject:state.ref||""});
    pdf.addImage(canvas.toDataURL("image/jpeg",0.94),"JPEG",0,0,210,297,undefined,"FAST");
    const blob=pdf.output("blob");
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=fileName();document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("PDF saved: "+fileName());
  }catch(e){
    if(e&&e.code==="declined")toast("Download cancelled.");
    else if(e&&e.code==="rate_limited")toast("A save prompt is already open. Finish it, then try again.");
    else toast(e&&e.message?e.message:"Could not create the PDF. Try again.");
  }finally{btn.disabled=false;btn.textContent="Download PDF"}
});

$("btnCopy").addEventListener("click",()=>{
  const s=state;
  const text=`Subject: Project Approval – ${s.project||""} (${s.ref||""})

Dear ${s.contact||"Sir/Madam"},

Greetings from Mycelium Dynamics Private Limited.

We are pleased to confirm that the project "${s.project||""}" has been approved. Please find attached the Project Approval Letter (Ref: ${s.ref||""}) with the approved scope, value${s.amount?" of "+inr(s.amount).replace("/-",""):""} and timelines.

Kindly review the letter and share your acceptance at the earliest so we can proceed to the next steps.

Warm regards,
${CO.name}
${CO.email} | ${CO.mobile}`;
  const done=()=>toast("Email text copied. Paste it into your mail and attach the PDF.");
  try{navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text))}catch(e){fallback(text)}
  function fallback(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(_){toast("Copy is blocked here. Select the text manually.")}ta.remove()}
});

window.addEventListener("resize",scale);
if(window.ResizeObserver)new ResizeObserver(scale).observe($("wrap"));
load();fill();render();
document.fonts&&document.fonts.ready.then(render);
</script>

</body>
